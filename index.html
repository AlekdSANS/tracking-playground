<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tracking Playground — Learn conversion tracking by doing</title>
		<meta
			name="description"
			content="A hands-on playground for testing forms, analytics events, consent, conversions, and UTM campaign links."
		/>
		<meta name="theme-color" content="#5b4df0" />
		<script>
			(() => {
				let savedTheme = null;

				try {
					savedTheme = window.localStorage.getItem("tracking-playground-theme");
				} catch {
					// Storage can be unavailable in privacy-restricted browsing contexts.
				}

				const theme = savedTheme === "light" || savedTheme === "dark"
					? savedTheme
					: "light";

				document.documentElement.dataset.theme = theme;
				document.querySelector('meta[name="theme-color"]')
					?.setAttribute("content", theme === "dark" ? "#121216" : "#5b4df0");
			})();
		</script>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Tracking Playground" />
		<meta
			property="og:description"
			content="Practice forms, analytics events, consent settings, and UTM links in one clear tracking playground."
		/>
		<meta property="og:image" content="/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tracking Playground" />
		<meta
			name="twitter:description"
			content="Practice forms, analytics events, consent settings, and UTM links in one clear tracking playground."
		/>
		<meta name="twitter:image" content="/og.jpg" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
